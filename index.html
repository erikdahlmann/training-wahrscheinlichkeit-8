<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbf6ee">
<title>Mathe-Training Klasse 8</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%89%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf6ee; --card:#ffffff; --ink:#2b2533; --muted:#6c6475; --line:#e9e0d3; --soft:#f5efe5;
  --pri:#5b45a8; --pri-d:#43337f; --pri-l:#ece6fb;
  --coral:#e2574c; --coral-l:#fde7e4;
  --mint:#1f8f6f; --mint-l:#dcf3ea;
  --sun:#e9a11f; --sun-l:#fdf0d4;
  --sky:#2f76b8; --sky-l:#e1eefa;
  --ok:#1d7f53; --ok-l:#e3f5ea; --bad:#b93a29; --bad-l:#fbe9e5;
  --r:18px; --sh:0 1px 2px rgba(43,37,51,.06),0 6px 20px rgba(43,37,51,.07);
  --font: ui-rounded,"SF Pro Rounded","Nunito","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --num: ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.5;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}
h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* Kopfleiste */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:8px 16px;
  background:rgba(251,246,238,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-weight:800;font-size:1.05rem}
.top .brand svg{width:40px;height:40px}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.95rem;white-space:nowrap}
.pill .st{color:var(--sun)}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.1rem;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}

main{max-width:980px;margin:0 auto;padding:16px 16px 140px}

/* Startseite */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin:8px 0 18px}
.hero svg.owl{width:110px;height:110px}
.hero h1{font-size:1.65rem;margin-bottom:.2em}
.hero p{margin:.2em 0}
.bubble{position:relative;background:var(--pri-l);border-radius:16px;padding:10px 14px;display:inline-block;margin-top:6px}
.namebox{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.namebox input{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);min-height:44px;width:180px}

.map{position:relative;background:linear-gradient(180deg,#eef6f1,#f7f1e6);border-radius:var(--r);padding:12px;box-shadow:var(--sh);overflow:hidden}
.map svg.road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stations{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.stn{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--card);
  border-radius:16px;padding:12px 14px;border:2px solid transparent;box-shadow:0 2px 8px rgba(43,37,51,.06);min-height:88px;transition:transform .12s ease,border-color .12s}
.stn:hover{transform:translateY(-2px);border-color:var(--pri-l)}
.stn:active{transform:scale(.98)}
.stn .ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c-l,var(--pri-l))}
.stn .ic svg{width:44px;height:44px}
.stn b{display:block;font-size:1.02rem}
.stn .nr{font-size:.78rem;font-weight:800;letter-spacing:.04em;color:var(--c,var(--pri));text-transform:uppercase}
.stn .bar{height:8px;border-radius:9px;background:var(--soft);margin-top:6px;overflow:hidden}
.stn .bar i{display:block;height:100%;background:var(--c,var(--pri));transform-origin:left;border-radius:9px}
.stn.done{border-color:var(--c,var(--pri))}
.stn .badge{font-size:.8rem;color:var(--muted)}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 4px 10px;font-size:1.05rem;font-weight:800;color:var(--muted)}
.sec-title::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.wide{grid-column:1/-1}

/* Stationsseite */
.band{border-radius:var(--r);padding:18px 20px;margin:8px 0 16px;background:var(--c,var(--pri));color:#fff;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.band h1{font-size:1.6rem;margin:0}
.band .nr{opacity:.85;font-weight:800;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase}
.band svg{width:72px;height:72px}
.band .prog{font-weight:700;margin-top:4px;opacity:.95}
.card{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin:0 0 16px}
.card > h2:first-child,.card > h3:first-child{margin-top:0}
.merk{border-left:6px solid var(--c,var(--pri));background:var(--c-l,var(--pri-l))}
.merk h3::before{content:"📌 "}
.fehler{border-left:6px solid var(--coral);background:var(--coral-l)}
.fehler h3::before{content:"⚠️ "}
.tipp-box{border-left:6px solid var(--sun);background:var(--sun-l)}
.formula{font-family:var(--num);font-size:1.1rem;background:rgba(255,255,255,.7);border-radius:10px;padding:8px 12px;display:inline-block;margin:4px 0}

/* Brüche */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 2px;font-family:var(--num)}
.fr > span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.fr > span{padding:0 3px;font-size:.92em}

/* Übungen */
.ex{border:2px solid var(--line);box-shadow:none}
.ex.solved{border-color:var(--ok);background:linear-gradient(180deg,#fff, #f6fcf8)}
.ex-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.ex-head h3{margin:0;font-size:1.12rem;flex:1;min-width:200px}
.lvl{font-size:.85rem;color:var(--sun);letter-spacing:1px;white-space:nowrap}
.lvl .off{color:#ddd3c2}
.check-ic{width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#bbb}
.ex.solved .check-ic{background:var(--ok);color:#fff}
.part{margin:12px 0}
.part-label{margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.ans{font:inherit;font-family:var(--num);font-size:1.1rem;min-height:48px;width:150px;padding:6px 12px;border-radius:12px;border:2px solid #d9cfbf;background:#fff;color:var(--ink);text-align:center}
input.ans:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 4px var(--pri-l)}
input.ans.ok{border-color:var(--ok);background:var(--ok-l)}
input.ans.bad{border-color:var(--bad);background:var(--bad-l)}
input.ans.sm{width:84px;min-height:44px;font-size:1rem;padding:4px 6px}
.fb{font-size:.95rem;margin-top:6px;min-height:0}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb:empty{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:8px 18px;border-radius:14px;border:0;cursor:pointer;font-weight:800;font-size:1rem;background:var(--pri);color:#fff;text-decoration:none;transition:transform .1s ease, background .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--pri-l)}
.btn.soft{background:var(--pri-l);color:var(--pri-d)}
.btn.warm{background:var(--sun);color:#3d2a00}
.btn.sm{min-height:40px;padding:6px 12px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:default}
.ex-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hint{background:var(--sun-l);border-radius:12px;padding:10px 14px;margin-top:10px}
.hint::before{content:"💡 ";}
.sol{background:var(--sky-l);border-radius:12px;padding:12px 16px;margin-top:10px}
.sol::before{content:"Lösung";display:block;font-weight:800;color:var(--sky);margin-bottom:4px}

/* Auswahl */
.opts{display:grid;gap:8px}
.opt{text-align:left;min-height:48px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:1rem;display:flex;gap:10px;align-items:center}
.opt .k{flex:0 0 28px;height:28px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--bad);background:var(--bad-l)}
.opts.cols2{grid-template-columns:1fr 1fr}

/* Reihenfolge */
.order-list{display:grid;gap:8px}
.order-item{display:flex;gap:10px;align-items:center;text-align:left;min-height:48px;padding:10px 14px;border-radius:14px;border:2px dashed #d9cfbf;background:#fff;cursor:pointer;font-size:1rem}
.order-item .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800}
.order-item.picked{border-style:solid;border-color:var(--pri);background:var(--pri-l)}
.order-item.picked .n{background:var(--pri);color:#fff}
.order-item.ok{border-color:var(--ok);background:var(--ok-l)} .order-item.ok .n{background:var(--ok)}

/* Paare */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:8px;align-content:start}
.pair-it{min-height:52px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left;font-size:.98rem;display:flex;align-items:center;gap:8px}
.pair-it.sel{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-l)}
.pair-it .tag{min-width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;background:#bbb}
.pair-it.ok{border-color:var(--ok)}

/* Tabellen */
table.t{border-collapse:collapse;margin:8px 0;font-family:var(--num);min-width:100%}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.t th{background:var(--soft);font-weight:800;text-align:left}
table.t td input.ans{width:78px;min-height:42px;font-size:1rem;padding:2px 4px}

/* Selbstkontrolle */
.self-model{display:none}
.self-model.show{display:block}
.selfbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* Bildschirmtastatur */
.keypad{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);z-index:80;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(43,37,51,.18);padding:10px 12px calc(12px + env(safe-area-inset-bottom));width:min(440px,100%);transition:transform .2s ease}
.keypad.show{transform:translate(-50%,0)}
.keypad .kp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.9rem;color:var(--muted)}
.keypad .kp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keypad button{min-height:54px;border-radius:14px;border:0;background:var(--soft);font-size:1.3rem;font-weight:700;cursor:pointer;font-family:var(--num)}
.keypad button:active{background:#e8dfd0}
.keypad button.ok{background:var(--pri);color:#fff}
.keypad button.fn{background:var(--pri-l);color:var(--pri-d)}

/* Eule-Toast */
.toast{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;align-items:flex-end;gap:8px;pointer-events:none;opacity:0;transform:translateY(20px);transition:opacity .25s, transform .25s}
.toast.show{opacity:1;transform:none}
.toast .msg{background:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;box-shadow:var(--sh);max-width:260px;font-weight:700}
.toast svg{width:70px;height:70px;flex:0 0 70px}
body.kp-open .toast{bottom:330px}

/* Konfetti */
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

/* Baum */
.tree-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.tree{position:relative;margin:0 auto}
.tree svg{position:absolute;inset:0;overflow:visible}
.tree .edge{stroke:#b8ad9c;stroke-width:3;fill:none;stroke-linecap:round}
.tree .edge.mark{stroke:var(--coral);stroke-width:5}
.tree .node{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid #b8ad9c;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem}
.tree .node.root{width:14px;height:14px;background:#b8ad9c}
.tree .lbl{position:absolute;transform:translate(-50%,-50%)}
.tree .lbl .given{background:#fff;border-radius:8px;padding:1px 4px;font-family:var(--num);font-size:.95rem;display:inline-block}
.tree .lbl input.ans{width:64px;min-height:40px;font-size:.95rem;padding:2px 4px;border-radius:10px}
.tree .leaf{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:var(--lw,80px)}
.tree .leafbtn{min-width:56px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;cursor:pointer;font-size:.9rem;padding:2px 6px}
.tree .leafbtn.mark{border-color:var(--coral);background:var(--coral-l);color:#8a2a20}
.tree .leafbtn[disabled]{cursor:default}
.tree .leaf input.ans{width:var(--lw,80px);max-width:96px;min-height:40px;font-size:.9rem;padding:2px}
.tree .lvlname{position:absolute;left:0;font-size:.8rem;color:var(--muted);transform:translateY(-50%)}

/* Simulator */
.sim-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.seg{display:inline-flex;border-radius:14px;background:var(--soft);padding:4px;gap:4px}
.seg button{border:0;background:transparent;min-height:42px;padding:6px 12px;border-radius:10px;cursor:pointer;font-weight:700}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1);color:var(--pri)}
.chart{width:100%;height:auto;display:block}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.minis .mc{background:var(--soft);border-radius:12px;padding:6px}
.minis .mc b{font-size:.8rem;display:block;text-align:center}

/* Socke */
.sock-stage{display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:16px;align-items:start}
.sock-stage svg{width:100%;height:auto}
.steps{display:grid;gap:10px}
.step{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:var(--soft)}
.step.cur{background:var(--pri-l)}
.step .ball{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff}

/* Baukasten */
.builder{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.counter{display:flex;align-items:center;gap:8px}
.counter button{width:48px;height:48px;border-radius:50%;border:0;background:var(--soft);font-size:1.4rem;font-weight:800;cursor:pointer}
.counter .v{min-width:34px;text-align:center;font-weight:800;font-size:1.3rem}

/* Geometrie */
.geo{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.geo canvas{display:block;width:100%;touch-action:none}
.geo-tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tool{min-height:52px;min-width:52px;padding:6px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:800;display:inline-flex;align-items:center;gap:6px;font-size:.95rem}
.tool svg{width:28px;height:28px}
.tool.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
.geo-msg{min-height:3em;font-size:.95rem;color:var(--muted);margin:4px 2px}
.geo-split{display:grid;grid-template-columns:1fr 200px;gap:14px;align-items:start}
@media (max-width:920px){.geo-split{grid-template-columns:1fr}.planfig{display:grid;grid-template-columns:200px 1fr;gap:10px;align-items:center;order:-1}.planfig b{grid-column:1/-1}}
.planfig{background:var(--soft);border-radius:14px;padding:8px}
.planfig b{font-size:.85rem;display:block;margin:0 0 4px 4px}

/* Probe-KA */
.ka-sheet{background:#fff;border-radius:6px;box-shadow:var(--sh);padding:22px 26px;border-top:8px solid var(--pri)}
.ka-sheet h3{margin-top:1.2em}
.ka-sheet ol.sub{list-style:lower-alpha;padding-left:1.4em}
.ka-sheet ol.sub li{margin:.3em 0}
.timer{font-family:var(--num);font-size:1.6rem;font-weight:800;color:var(--pri)}
.pts{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.pts .stepper{display:flex;align-items:center;gap:6px}
.pts .stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);font-weight:800;font-size:1.2rem;cursor:pointer}
.pts .stepper .v{min-width:56px;text-align:center;font-weight:800}

.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:999px;padding:4px 10px;background:var(--soft);font-size:.85rem;font-weight:700}

.settings label{display:flex;align-items:center;gap:10px;min-height:48px}
.settings input[type=checkbox]{width:26px;height:26px}

@media (max-width:720px){
  body{font-size:17px}
  .stations{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;text-align:center}
  .hero svg.owl{margin:0 auto}
  .geo-split{grid-template-columns:1fr}
  .sock-stage{grid-template-columns:1fr}
  .sock-stage svg{max-width:220px;margin:0 auto}
  .opts.cols2{grid-template-columns:1fr}
  .minis{grid-template-columns:repeat(2,1fr)}
  .top .brand span{display:none}
  .band svg{width:54px;height:54px}
  .pairs{grid-template-columns:1fr 1fr;gap:6px}
  .pair-it{font-size:.9rem}
  .pts{grid-template-columns:1fr}
  .tree .lvlname{font-size:.7rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.top,.keypad,.toast,.ex-actions,.geo-tools{display:none!important} body{background:#fff}}
.ball{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;vertical-align:middle;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.balls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.intro{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.intro .pic{width:120px}
@media (max-width:720px){.intro{grid-template-columns:1fr}.intro .pic{display:none}}

</style>
</head>
<body>
<main id="main"></main>
<noscript><p style="padding:20px">Bitte JavaScript einschalten.</p></noscript>
<script>
/* ===== Grundlagen ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fr = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const pct = (v, d = 2) => (v * 100).toFixed(d).replace('.', ',') + ' %';
const dez = (v, d = 2) => (+v.toFixed(d)).toString().replace('.', ',');
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const TOUCH = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;

/* ===== Speicher ===== */
const KEY = 'klasse8-training-v1';

try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { }

/* ===== Eingaben lesen ===== */
// liefert {v, kind} oder null; kind: 'frac' | 'dec' | 'pct'
function parseAns(str) {
  if (str == null) return null;
  let s = String(str).trim().replace(/\s+/g, '').replace(/^P\(.*?\)=/i, '').replace(/^[≈=~]/, '').replace(/,/g, '.');
  if (!s) return null;
  let m;
  if ((m = s.match(/^(-?\d+(?:\.\d+)?)%$/))) return { v: +m[1] / 100, kind: 'pct' };
  if ((m = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/))) { if (+m[2] === 0) return null; return { v: +m[1] / +m[2], kind: 'frac' }; }
  if ((m = s.match(/^-?\d+(?:\.\d+)?$/)) || (m = s.match(/^-?\.\d+$/))) return { v: +s, kind: 'dec' };
  return null;
}

// prüft einen Zahlenteil. part: {ans, kind:'prob'|'num', tol, wrong:[{v,msg}], exact}
function judgeNum(part, raw) {
  const p = parseAns(raw);
  if (!p) return { ok: false, msg: raw.trim() ? 'Das kann ich nicht lesen. Schreib z. B. 3/10, 0,3 oder 30 %.' : 'Hier fehlt noch etwas.' };
  const kind = part.kind || 'prob';
  let v = p.v;
  if (kind === 'prob') {
    if (v > 1 && p.kind === 'dec') {
      if (Math.abs(v / 100 - part.ans) <= (part.tol ?? 0.0051)) return { ok: false, msg: `Fast! Meinst du ${raw.trim()} %? Schreib das %-Zeichen dazu.` };
      return { ok: false, msg: 'Eine Wahrscheinlichkeit liegt immer zwischen 0 und 1 (also 0 % bis 100 %).' };
    }
    if (v > 1 || v < 0) return { ok: false, msg: 'Eine Wahrscheinlichkeit liegt immer zwischen 0 und 1 (also 0 % bis 100 %).' };
  }
  const tight = 1e-9;
  let tol = kind === 'prob' ? (p.kind === 'frac' ? tight : (part.tol ?? 0.0051)) : (part.tol ?? 0.011);
  if (part.exact) tol = tight;
  for (const w of (part.wrong || [])) {
    if (Math.abs(v - w.v) <= Math.min(tol, 0.0006) + tight && Math.abs(w.v - part.ans) > tight) return { ok: false, msg: w.msg };
  }
  if (Math.abs(v - part.ans) <= tol) {
    if (kind === 'prob' && p.kind === 'frac' && part.ans * 100 % 1 !== 0) return { ok: true, msg: '' };
    return { ok: true, msg: '' };
  }
  if (kind === 'prob' && p.kind === 'frac' && Math.abs(v - part.ans) <= 0.0051) return { ok: false, msg: 'Der Bruch ist nah dran, aber nicht genau. Rechne noch einmal exakt.' };
  if (kind === 'prob' && Math.abs(v - part.ans) <= 0.02) return { ok: false, msg: 'Knapp daneben. Prüfe das Runden (zwei Nachkommastellen bei Prozent).' };
  return { ok: false, msg: part.miss || pick(['Noch nicht richtig. Schau dir den Tipp an.', 'Das stimmt noch nicht. Rechne Schritt für Schritt.', 'Noch nicht. Was genau ist gefragt?']) };
}

/* ===== Bildschirmtastatur ===== */
const Keypad = (() => {
  let target = null, box = null;
  function build() {
    box = el(`<div class="keypad" role="group" aria-label="Zahlentastatur">
      <div class="kp-top"><span>Bruch: 3/10 · Dezimal: 0,3 · Prozent: 30 %</span><button class="fn" data-k="hide" style="min-height:36px;padding:0 12px;font-size:.9rem">Fertig</button></div>
      <div class="kp-grid">
        ${['7', '8', '9', '⌫', '4', '5', '6', '/', '1', '2', '3', '%', '0', ',', 'C', '✓'].map(k => `<button data-k="${k}" class="${k === '✓' ? 'ok' : (['⌫', '/', '%', 'C'].includes(k) ? 'fn' : '')}">${k}</button>`).join('')}
      </div></div>`);
    document.body.appendChild(box);
    box.addEventListener('pointerdown', e => e.preventDefault());
    box.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b || !target) return;
      const k = b.dataset.k;
      if (k === 'hide') return hide();
      if (k === '⌫') target.value = target.value.slice(0, -1);
      else if (k === 'C') target.value = '';
      else if (k === '✓') { const t = target; hide(); t.dispatchEvent(new CustomEvent('enter', { bubbles: true })); return; }
      else target.value += (k === '%' ? ' %' : k);
      target.dispatchEvent(new Event('input', { bubbles: true }));
    });
  }
  function show(inp) {
    if (!box) build();
    target = inp; box.classList.add('show'); document.body.classList.add('kp-open');
    setTimeout(() => { const r = inp.getBoundingClientRect(); const kh = box.offsetHeight; if (r.bottom > innerHeight - kh - 10) window.scrollBy({ top: r.bottom - (innerHeight - kh - 20), behavior: 'smooth' }); }, 60);
  }
  function hide() { if (box) box.classList.remove('show'); document.body.classList.remove('kp-open'); if (target) target.blur(); target = null; }
  document.addEventListener('focusin', e => { const t = e.target; if (t.matches && t.matches('input.ans') && TOUCH) show(t); });
  document.addEventListener('pointerdown', e => { if (!box || !box.classList.contains('show')) return; if (e.target.closest('.keypad') || e.target.matches('input.ans')) return; hide(); });
  return { show, hide };
})();
function ansInput(cls = '', ph = '') {
  return `<input class="ans ${cls}" type="text" ${TOUCH ? 'inputmode="none"' : 'inputmode="decimal"'} autocomplete="off" autocorrect="off" spellcheck="false" placeholder="${ph}">`;
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches && e.target.matches('input.ans')) { e.preventDefault(); e.target.dispatchEvent(new CustomEvent('enter', { bubbles: true })); } });

/* ===== Eule und Konfetti ===== */
const LOB = ['Stark!', 'Genau so!', 'Richtig, das sitzt.', 'Super gemacht!', 'Klasse, weiter so!', 'Yes! Richtig.', 'Sauber gerechnet!'];
const MUT = ['Fast! Schau noch mal hin.', 'Noch nicht. Der Tipp hilft.', 'Fehler sind zum Lernen da.', 'Probier es noch einmal.'];
let toastTimer;
function owlSay(msg, mood = 'happy') {
  if (!S.owl) return;
  let t = $('.toast');
  if (!t) { t = el(`<div class="toast" aria-live="polite"><div class="msg"></div><div class="o"></div></div>`); document.body.appendChild(t); }
  $('.msg', t).textContent = msg; $('.o', t).innerHTML = owlSVG(mood);
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function confetti() {
  if (!S.confetti || matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const c = el('<canvas class="confetti"></canvas>'); document.body.appendChild(c);
  const dpr = devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);
  const cols = ['#5b45a8', '#e2574c', '#1f8f6f', '#e9a11f', '#2f76b8', '#f19ac0'];
  const P = Array.from({ length: 140 }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: pick(cols), a: Math.random() * 6, va: (Math.random() - .5) * .3 }));
  let f = 0;
  (function loop() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); }
    if (++f < 150) requestAnimationFrame(loop); else c.remove();
  })();
}

/* ===== Übungs-Motor =====
   ex = {id, st:1..3, title, q, parts:[...], hints:[...], sol}
   part-Typen: num, mc, order, pair, self, tree, geo, table, custom
*/
const PartTypes = {};
function stars(n) { return `<span class="lvl" title="${['', 'leicht', 'mittel', 'Klassenarbeit-Niveau'][n]}">${'★'.repeat(n)}<span class="off">${'★'.repeat(3 - n)}</span></span>`; }

function renderExercise(ex, host, opts = {}) {
  const card = el(`<section class="card ex" id="ex-${ex.id}">
    <div class="ex-head"><div class="check-ic">✓</div><h3>${ex.title}</h3>${stars(ex.st || 1)}</div>
    ${ex.q ? `<div class="q">${ex.q}</div>` : ''}
    <div class="parts"></div>
    <div class="hints"></div>
    <div class="ex-actions">
      ${ex.parts.some(p => PartTypes[p.t].needsCheck) ? '<button class="btn chk">Prüfen</button>' : ''}
      ${ex.hints && ex.hints.length ? '<button class="btn soft hbtn">💡 Tipp</button>' : ''}
      ${ex.sol ? '<button class="btn ghost sbtn">Lösung zeigen</button>' : ''}
    </div>
    <div class="solbox"></div></section>`);
  host.appendChild(card);
  const ctl = []; const partsEl = $('.parts', card);
  ex.parts.forEach((p, i) => {
    const pe = el(`<div class="part">${p.label ? `<div class="part-label">${p.label}</div>` : ''}<div class="pbody"></div><div class="fb"></div></div>`);
    partsEl.appendChild(pe);
    const c = PartTypes[p.t].render(p, $('.pbody', pe), $('.fb', pe), () => onPartChange());
    c.part = p; ctl.push(c);
  });
  const isDone = () => !!S.done[ex.id];
  function markSolved(quiet) {
    card.classList.add('solved');
    if (!isDone()) { S.done[ex.id] = 1; save(); if (!quiet) { owlSay(pick(LOB), 'cheer'); } updateProgress(); }
    opts.onSolved && opts.onSolved();
  }
  function onPartChange() {
    // automatisch fertig, wenn alle Teile ohne Prüfen-Knopf erledigt sind
    if (ctl.every(c => c.state === true)) markSolved();
  }
  function checkAll() {
    let all = true, anyBad = false;
    for (const c of ctl) { const r = c.check ? c.check() : c.state === true; if (!r) { all = false; if (c.state === false) anyBad = true; } }
    if (all) markSolved(); else if (anyBad) owlSay(pick(MUT), 'think');
  }
  const chk = $('.chk', card); if (chk) chk.onclick = checkAll;
  card.addEventListener('enter', (e) => { checkAll(); });
  let hi = 0;
  const hb = $('.hbtn', card); if (hb) hb.onclick = () => {
    if (hi < ex.hints.length) { $('.hints', card).appendChild(el(`<div class="hint">${ex.hints[hi]}</div>`)); hi++; }
    if (hi >= ex.hints.length) hb.disabled = true;
  };
  const sb = $('.sbtn', card); if (sb) sb.onclick = () => {
    const box = $('.solbox', card);
    if (box.firstChild) { box.innerHTML = ''; sb.textContent = 'Lösung zeigen'; return; }
    box.appendChild(el(`<div class="sol">${ex.sol}</div>`)); sb.textContent = 'Lösung ausblenden';
  };
  if (isDone()) card.classList.add('solved');
  return card;
}

/* Zahl-Eingabe */
PartTypes.num = {
  needsCheck: true,
  render(p, body, fb, changed) {
    body.innerHTML = `<div class="row">${p.pre ? `<span>${p.pre}</span>` : ''}${ansInput('', p.ph || '')}${p.post ? `<span>${p.post}</span>` : ''}</div>`;
    const inp = $('input', body);
    const c = {
      state: null, check() {
        const r = judgeNum(p, inp.value);
        inp.classList.toggle('ok', r.ok); inp.classList.toggle('bad', !r.ok);
        fb.className = 'fb ' + (r.ok ? 'ok' : 'bad'); fb.innerHTML = r.ok ? (p.okmsg || 'Richtig!') : r.msg;
        c.state = r.ok; return r.ok;
      }
    };
    inp.addEventListener('input', () => { inp.classList.remove('ok', 'bad'); fb.textContent = ''; c.state = null; });
    return c;
  }
};

/* Tabelle mit Eingabefeldern: p.head (Array), p.rows: [{label, cells:[text | {ans, kind, tol}]}] */
PartTypes.table = {
  needsCheck: true,
  render(p, body, fb) {
    const fields = [];
    const t = el(`<div class="tw"><table class="t"><thead><tr><th>${p.corner || ''}</th>${p.head.map(h => `<th style="text-align:center">${h}</th>`).join('')}</tr></thead><tbody></tbody></table></div>`);
    const tb = $('tbody', t);
    p.rows.forEach(r => {
      const tr = el(`<tr><th>${r.label}</th></tr>`);
      r.cells.forEach(cell => {
        const td = document.createElement('td');
        if (cell && typeof cell === 'object') { td.innerHTML = ansInput('sm'); fields.push({ inp: $('input', td), part: cell }); }
        else td.innerHTML = cell;
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    body.appendChild(t);
    const c = {
      state: null, check() {
        let ok = true, msg = '';
        for (const f of fields) {
          const r = judgeNum(f.part, f.inp.value);
          f.inp.classList.toggle('ok', r.ok); f.inp.classList.toggle('bad', !r.ok);
          if (!r.ok) { ok = false; if (!msg) msg = r.msg; }
        }
        fb.className = 'fb ' + (ok ? 'ok' : 'bad'); fb.innerHTML = ok ? (p.okmsg || 'Alle Felder richtig!') : 'Rot markierte Felder stimmen noch nicht. ' + msg;
        c.state = ok; return ok;
      }
    };
    fields.forEach(f => f.inp.addEventListener('input', () => { f.inp.classList.remove('ok', 'bad'); c.state = null; }));
    return c;
  }
};

/* Auswahl: p.opts, p.ok (Array der richtigen Indizes), p.multi, p.why {i: text} */
PartTypes.mc = {
  needsCheck: false,
  render(p, body, fb, changed) {
    const L = 'ABCDEFGH';
    const order = p.keep ? p.opts.map((_, i) => i) : shuffle(p.opts.map((_, i) => i));
    body.innerHTML = `<div class="opts ${p.cols ? 'cols2' : ''}">${order.map((i, k) => `<button class="opt" data-i="${i}"><span class="k">${L[k]}</span><span>${p.opts[i]}</span></button>`).join('')}</div>${p.multi ? '<div class="row" style="margin-top:8px"><button class="btn sm mcgo">Auswahl prüfen</button><span class="small muted">Mehrere Antworten können richtig sein.</span></div>' : ''}`;
    const c = { state: null };
    const sel = new Set();
    function verdict() {
      const okSet = new Set(p.ok);
      const right = sel.size === okSet.size && [...sel].every(i => okSet.has(i));
      $$('.opt', body).forEach(b => { const i = +b.dataset.i; b.classList.remove('ok', 'bad'); if (sel.has(i)) b.classList.add(okSet.has(i) ? 'ok' : 'bad'); });
      if (right) { fb.className = 'fb ok'; fb.innerHTML = p.okmsg || 'Richtig!'; c.state = true; $$('.opt', body).forEach(b => b.disabled = true); changed(); }
      else {
        const wrongPick = [...sel].find(i => !okSet.has(i));
        fb.className = 'fb bad';
        fb.innerHTML = (wrongPick != null && p.why && p.why[wrongPick]) ? p.why[wrongPick] : (p.multi && [...sel].every(i => okSet.has(i)) ? 'Richtig, aber es fehlt noch mindestens eine Antwort.' : 'Noch nicht ganz.');
        c.state = false; owlSay(pick(MUT), 'think');
      }
    }
    body.addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (b && !b.disabled) {
        const i = +b.dataset.i;
        if (p.multi) { sel.has(i) ? sel.delete(i) : sel.add(i); b.classList.toggle('sel'); b.classList.remove('ok', 'bad'); fb.textContent = ''; }
        else { sel.clear(); sel.add(i); verdict(); }
      }
      if (e.target.closest('.mcgo')) verdict();
    });
    return c;
  }
};

/* Reihenfolge durch Antippen: p.items in richtiger Reihenfolge */
PartTypes.order = {
  needsCheck: false,
  render(p, body, fb, changed) {
    const idx = shuffle(p.items.map((_, i) => i));
    body.innerHTML = `<p class="small muted">Tippe die Karten in der richtigen Reihenfolge an. Nochmal tippen nimmt eine Karte zurück.</p><div class="order-list">${idx.map(i => `<button class="order-item" data-i="${i}"><span class="n"></span><span>${p.items[i]}</span></button>`).join('')}</div><div class="row" style="margin-top:8px"><button class="btn sm ghost oreset">Neu anfangen</button></div>`;
    const seq = []; const c = { state: null };
    function paint() {
      $$('.order-item', body).forEach(b => { const k = seq.indexOf(+b.dataset.i); b.classList.toggle('picked', k >= 0); $('.n', b).textContent = k >= 0 ? k + 1 : ''; b.classList.remove('ok'); });
    }
    body.addEventListener('click', e => {
      if (e.target.closest('.oreset')) { seq.length = 0; paint(); fb.textContent = ''; c.state = null; return; }
      const b = e.target.closest('.order-item'); if (!b || c.state === true) return;
      const i = +b.dataset.i; const k = seq.indexOf(i);
      if (k >= 0) seq.splice(k, 1); else seq.push(i);
      paint(); fb.textContent = '';
      if (seq.length === p.items.length) {
        const firstWrong = seq.findIndex((v, k) => v !== k);
        if (firstWrong < 0) { $$('.order-item', body).forEach(b => b.classList.add('ok')); fb.className = 'fb ok'; fb.innerHTML = p.okmsg || 'Richtige Reihenfolge!'; c.state = true; changed(); }
        else { fb.className = 'fb bad'; fb.innerHTML = `Die ersten ${firstWrong} Karten passen${firstWrong === 0 ? ' noch nicht' : ''}. Ab Karte ${firstWrong + 1} stimmt es nicht. Tippe Karten an, um sie zurückzunehmen.`; c.state = false; owlSay(pick(MUT), 'think'); }
      }
    });
    return c;
  }
};

/* Paare durch Antippen: p.left, p.right, p.map[li] = ri */
PartTypes.pair = {
  needsCheck: false,
  render(p, body, fb, changed) {
    const cols = ['#5b45a8', '#e2574c', '#1f8f6f', '#e9a11f', '#2f76b8', '#b04a8f'];
    const ro = shuffle(p.right.map((_, i) => i));
    body.innerHTML = `<p class="small muted">Tippe links eine Karte an und dann rechts die passende.</p><div class="pairs"><div class="col L">${p.left.map((t, i) => `<button class="pair-it" data-l="${i}"><span class="tag"></span><span>${t}</span></button>`).join('')}</div><div class="col R">${ro.map(i => `<button class="pair-it" data-r="${i}"><span class="tag"></span><span>${p.right[i]}</span></button>`).join('')}</div></div>`;
    const link = {}; let curL = null; const c = { state: null };
    function paint() {
      $$('[data-l]', body).forEach(b => { const l = +b.dataset.l; const has = link[l] != null; $('.tag', b).style.background = has ? cols[l % 6] : '#ccc'; $('.tag', b).textContent = has ? l + 1 : ''; b.classList.toggle('sel', curL === l); });
      $$('[data-r]', body).forEach(b => { const r = +b.dataset.r; const l = Object.keys(link).find(k => link[k] === r); $('.tag', b).style.background = l != null ? cols[l % 6] : '#ccc'; $('.tag', b).textContent = l != null ? (+l + 1) : ''; });
    }
    body.addEventListener('click', e => {
      if (c.state === true) return;
      const bl = e.target.closest('[data-l]'), br = e.target.closest('[data-r]');
      if (bl) { curL = +bl.dataset.l; paint(); return; }
      if (br && curL != null) {
        const r = +br.dataset.r; for (const k in link) if (link[k] === r) delete link[k];
        link[curL] = r; curL = null; paint();
        if (Object.keys(link).length === p.left.length) {
          const wrong = p.left.filter((_, l) => link[l] !== p.map[l]).length;
          if (!wrong) { fb.className = 'fb ok'; fb.innerHTML = p.okmsg || 'Alle Paare passen!'; c.state = true; $$('.pair-it', body).forEach(b => b.classList.add('ok')); changed(); }
          else { fb.className = 'fb bad'; fb.innerHTML = `${wrong} ${wrong === 1 ? 'Paar passt' : 'Paare passen'} noch nicht. Tippe links an und wähle neu.`; c.state = false; owlSay(pick(MUT), 'think'); }
        }
      }
    });
    paint();
    return c;
  }
};

/* Eigene Bausteine: p.render(body, fb, done) */
PartTypes.custom = {
  needsCheck: false,
  render(p, body, fb, changed) {
    const c = { state: null };
    const api = p.render(body, fb, (ok) => { c.state = ok; if (ok) changed(); });
    if (api && api.check) { c.check = () => { const r = api.check(); c.state = r; return r; }; PartTypes.custom.needsCheck = false; }
    return c;
  }
};
PartTypes.customCheck = {
  needsCheck: true,
  render(p, body, fb, changed) {
    const c = { state: null };
    const api = p.render(body, fb, (ok) => { c.state = ok; });
    c.check = () => { const r = api.check(); c.state = r; return r; };
    return c;
  }
};

/* ===== Stationen und Navigation ===== */
const STATIONS = []; // {id, nr, title, short, color, colorL, icon, part:'W'|'G', build(host)}
function station(def) { STATIONS.push(def); }
const EXIDS = {}; // station id -> [exercise ids]
function exList(sid, list) { EXIDS[sid] = list.map(e => e.id); return list; }
function stProgress(sid) { const ids = EXIDS[sid] || []; const d = ids.filter(i => S.done[i]).length; return { d, n: ids.length }; }
function totalStars() { let d = 0, n = 0; for (const k in EXIDS) { const p = stProgress(k); d += p.d; n += p.n; } return { d, n }; }

function updateProgress() {
  const t = totalStars();
  const pill = $('#starpill'); if (pill) pill.innerHTML = `<span class="st">★</span> ${t.d} / ${t.n}`;
  const cur = STATIONS.find(s => s.id === location.hash.slice(1));
  if (cur) {
    const p = stProgress(cur.id); const pe = $('.band .prog'); if (pe) pe.textContent = `${p.d} von ${p.n} Aufgaben geschafft`;

/* ===== Baumdiagramm-Werkstatt =====
 spec = {
   depth, levelNames?: [..],
   branches(path) -> [{lab, p, show}]   // show = Anzeigetext (HTML) für vorgegebene Äste
   ask: 'all' | 'none' | (path, k) => bool
   mark?: (leafPath) => bool            // Zielpfade zum Markieren
   leafAsk?: bool                       // Pfadwahrscheinlichkeit unter markierten Zielpfaden eintragen
   errorAt?: 'a,b|k'                    // Fehlersuche: falscher Ast (Pfad-Schlüssel + Index)
   alt?: (path, k, v) => msg|null       // eigene Rückmeldung für typische Fehlwerte
   leafText?: (path) => string
 }
*/
function buildTree(spec) {
  const leaves = [];
  function grow(path, prob, depth) {
    const node = { path, prob, kids: [] };
    if (depth < spec.depth) {
      spec.branches(path).forEach((b, k) => {
        if (b.p === 0 && spec.dropZero) return;
        const ch = grow(path.concat(b.lab), prob * b.p, depth + 1);
        ch.edge = b; ch.k = k; ch.parent = node; node.kids.push(ch);
      });
    } else leaves.push(node);
    return node;
  }
  const root = grow([], 1, 0);
  return { root, leaves };
}

PartTypes.tree = {
  needsCheck: true,
  render(spec, body, fb) {
    const { root, leaves } = buildTree(spec);
    const wrap = el('<div class="tree-wrap"></div>'); body.appendChild(wrap);
    const avail = Math.max(300, (body.clientWidth || 700) - 4);
    const L = leaves.length, LM = spec.levelNames ? (avail < 500 ? 46 : 64) : 0;
    const deepAsk = spec.ask === 'all' || (typeof spec.ask === 'function' && leaves.some(n => spec.ask(n.parent.path, n.k)));
    const lw = Math.max(deepAsk ? 98 : 64, Math.min(deepAsk ? 120 : 104, Math.floor((avail - LM) / L)));
    const W = Math.max(LM + lw * L, 300), GAP = spec.gap || 104, TOP = 26;
    const H = TOP + spec.depth * GAP + (spec.leafAsk ? 110 : 64);
    const box = el(`<div class="tree" style="width:${W}px;height:${H}px;--lw:${lw - 8}px"></div>`); wrap.appendChild(box);
    leaves.forEach((n, i) => n.x = LM + lw * (i + .5));
    (function setX(n) { if (n.kids.length) { n.kids.forEach(setX); n.x = n.kids.reduce((a, c) => a + c.x, 0) / n.kids.length; } })(root);
    const all = []; (function walk(n, d) { n.d = d; n.y = TOP + d * GAP; all.push(n); n.kids.forEach(c => walk(c, d + 1)); })(root, 0);
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('width', W); svg.setAttribute('height', H); box.appendChild(svg);
    const asked = [];

    all.forEach(n => {
      if (n.parent) {
        const ln = document.createElementNS(svgNS, 'line');
        ln.setAttribute('x1', n.parent.x); ln.setAttribute('y1', n.parent.y); ln.setAttribute('x2', n.x); ln.setAttribute('y2', n.y); ln.setAttribute('class', 'edge');
        svg.appendChild(ln); n.line = ln;

        lab.style.left = (mx + dir * 34) + 'px'; lab.style.top = my + 'px';
      }

    if (spec.levelNames) spec.levelNames.forEach((t, i) => box.appendChild(el(`<div class="lvlname" style="top:${TOP + (i + 1) * GAP}px">${t}</div>`)));
    // Blätter
    const marked = new Set(); const leafInputs = new Map();
    leaves.forEach((n, i) => {

      box.appendChild(lf); n.leafEl = lf;
      if (spec.mark) $('.leafbtn', lf).onclick = () => {
        if (marked.has(i)) { marked.delete(i); const li = leafInputs.get(i); if (li) { li.remove(); leafInputs.delete(i); } }
        else { marked.add(i); if (spec.leafAsk) { const inp = el(ansInput('', 'P = ?')); lf.appendChild(inp); leafInputs.set(i, inp); } }
        paintMarks(); fb.textContent = '';
      };
    });
    function paintMarks() {
      all.forEach(n => n.line && n.line.classList.remove('mark'));
      leaves.forEach((n, i) => { $('.leafbtn', n.leafEl).classList.toggle('mark', marked.has(i)); if (marked.has(i)) { let m = n; while (m.parent) { m.line.classList.add('mark'); m = m.parent; } } });
    }
    const c = { state: null };
    if (spec.errorAt != null) {
      box.addEventListener('click', e => {
        const b = e.target.closest('button.given'); if (!b || c.state === true) return;
        if (b.dataset.key === spec.errorAt) { b.style.borderColor = 'var(--ok)'; b.style.background = 'var(--ok-l)'; fb.className = 'fb ok'; fb.innerHTML = spec.okmsg || 'Gefunden!'; c.state = true; }
        else { b.style.borderColor = 'var(--bad)'; fb.className = 'fb bad'; fb.innerHTML = 'Dieser Ast stimmt. Such weiter.'; c.state = false; }
      });
      c.check = () => c.state === true;
      return c;
    }
    asked.forEach(a => a.inp.addEventListener('input', () => { a.inp.classList.remove('ok', 'bad'); }));
    c.check = () => {
      let ok = true; const msgs = [];
      asked.forEach(({ n, inp }) => {
        const r = judgeNum({ ans: n.edge.p, kind: 'prob', tol: 0.0051 }, inp.value);
        inp.classList.toggle('ok', r.ok); inp.classList.toggle('bad', !r.ok);
        if (!r.ok) {
          ok = false;
          const v = (parseAns(inp.value) || {}).v;
          const alt = spec.alt && v != null ? spec.alt(n.parent.path, n.k, v) : null;
          if (alt) msgs.push(alt);
        }
      });
      // Summe an Verzweigungen
      if (!ok && asked.length) {
        for (const n of all) {
          if (!n.kids.length) continue;
          const vals = n.kids.map(k => { const a = asked.find(x => x.n === k); return a ? (parseAns(a.inp.value) || {}).v : k.edge.p; });
          if (vals.every(v => v != null) && Math.abs(vals.reduce((s, v) => s + v, 0) - 1) > 0.011) { msgs.push('Achtung: An jeder Verzweigung ergeben die Äste zusammen 1 (also 100 %).'); break; }
        }
      }
      if (spec.mark) {
        const target = new Set(leaves.map((n, i) => spec.mark(n.path) ? i : -1).filter(i => i >= 0));
        const hit = [...marked].filter(i => target.has(i)).length, extra = [...marked].filter(i => !target.has(i)).length;
        if (hit !== target.size || extra) {
          ok = false;
          msgs.push(extra ? `Mindestens ein markierter Pfad passt nicht zum Ereignis${spec.markLabel ? ' „' + spec.markLabel + '“' : ''}.` : `Du hast ${hit} von ${target.size} passenden Pfaden markiert. Es fehlen noch welche.`);
        } else if (spec.leafAsk) {
          let lok = true;
          leafInputs.forEach((inp, i) => {
            const r = judgeNum({ ans: leaves[i].prob, kind: 'prob', tol: 0.0051 }, inp.value);
            inp.classList.toggle('ok', r.ok); inp.classList.toggle('bad', !r.ok); if (!r.ok) lok = false;
          });
          if (!lok) { ok = false; msgs.push('Pfadregel: Multipliziere die Wahrscheinlichkeiten entlang des Pfades.'); }
        }
      }
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.innerHTML = ok ? (spec.okmsg || 'Der Baum stimmt!') : (msgs[0] || 'Rot markierte Felder stimmen noch nicht.');
      c.state = ok; return ok;
    };
    return c;
  }
};

/* ===== Simulatoren und interaktive Bausteine ===== */
function barsSVG(vals, labels, opts = {}) {
  const W = opts.w || 520, H = opts.h || 220, pad = 30, n = vals.length, bw = (W - pad - 10) / n;
  const max = opts.max || Math.max(.4, ...vals) * 1.1;
  const y = (v) => H - 26 - v / max * (H - 46);
  const cols = opts.cols || Array(n).fill('#5b45a8');
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Säulendiagramm">`;
  for (let t = 0; t <= max + 1e-9; t += (max > .6 ? .2 : .1)) s += `<line x1="${pad}" x2="${W - 6}" y1="${y(t)}" y2="${y(t)}" stroke="#eee6da"/><text x="${pad - 4}" y="${y(t) + 4}" font-size="11" text-anchor="end" fill="#6c6475">${Math.round(t * 100)}%</text>`;
  if (opts.ref != null) s += `<line x1="${pad}" x2="${W - 6}" y1="${y(opts.ref)}" y2="${y(opts.ref)}" stroke="#e2574c" stroke-width="2" stroke-dasharray="6 5"/><text x="${W - 8}" y="${y(opts.ref) - 5}" font-size="11" text-anchor="end" fill="#e2574c">${opts.refLabel || ''}</text>`;
  vals.forEach((v, i) => {
    const x = pad + 6 + i * bw;
    s += `<rect x="${x}" y="${y(v)}" width="${bw - 12}" height="${Math.max(0, H - 26 - y(v))}" rx="5" fill="${cols[i]}"/>`;
    if (!opts.noVal) s += `<text x="${x + (bw - 12) / 2}" y="${y(v) - 5}" font-size="12" text-anchor="middle" font-weight="700" fill="#2b2533">${(v * 100).toFixed(opts.dec ?? 1).replace('.', ',')}%</text>`;
    s += `<text x="${x + (bw - 12) / 2}" y="${H - 8}" font-size="14" text-anchor="middle" font-weight="800" fill="#2b2533">${labels[i]}</text>`;
  });
  return s + '</svg>';
}
function rollWeighted(w) { const t = w.reduce((a, b) => a + b, 0); let r = Math.random() * t; for (let i = 0; i < w.length; i++) { r -= w[i]; if (r < 0) return i; } return w.length - 1; }

/* Socke: Pfad Schritt für Schritt (erst vorhersagen, dann ziehen)
   cfg = {balls:'UUHH', word:'UHU', back:false} */
function sockPathPart(cfg) {
  return {
    t: 'custom', render(body, fb, done) {
      let bag, step, probs;
      body.innerHTML = `<div class="sock-stage"><div class="sk"></div><div><div class="steps"></div><div class="row" style="margin-top:10px"><button class="btn sm ghost again">Nochmal von vorn</button></div></div></div>`;
      function reset() { bag = cfg.balls.split(''); step = 0; probs = []; paint(); }
      function paint() {
        $('.sk', body).innerHTML = sockSVG(bag.map(t => ({ t, c: BALLC[t] })), { label: `${bag.length} Kugeln in der Socke` });
        const st = $('.steps', body); st.innerHTML = '';
        cfg.word.split('').forEach((ch, i) => {
          const row = el(`<div class="step ${i === step ? 'cur' : ''}"><b>${i + 1}. Zug:</b> ${ball(ch)} <span>P(${ch}) =</span> ${i < step ? `<b>${probs[i]}</b> ✓` : (i === step ? ansInput('sm') + '<button class="btn sm go">ziehen</button>' : '<span class="muted">…</span>')}</div>`);
          st.appendChild(row);
        });
        if (step === cfg.word.length) {
          const last = el(`<div class="step cur"><b>Pfadregel:</b>&nbsp;P(${cfg.word}) = ${probs.join(' · ')} = ${ansInput('sm')} <button class="btn sm go2">prüfen</button></div>`);
          st.appendChild(last);
        }
        const inp = $('.step.cur input', body); if (inp && !TOUCH) inp.focus();
      }
      body.addEventListener('click', e => {
        if (e.target.closest('.again')) { reset(); fb.textContent = ''; return; }
        if (e.target.closest('.go')) {
          const ch = cfg.word[step]; const n = bag.filter(x => x === ch).length; const inp = $('.step.cur input', body);
          const r = judgeNum({ ans: n / bag.length, kind: 'prob', tol: 0.0051 }, inp.value);
          if (!r.ok) { inp.classList.add('bad'); fb.className = 'fb bad'; fb.innerHTML = `Zähle: Wie viele ${ch} sind gerade in der Socke, und wie viele Kugeln insgesamt? ${r.msg.startsWith('Eine') ? r.msg : ''}`; return; }
          probs.push(fr(n, bag.length).replace('class="fr"', 'class="fr"'));
          fb.className = 'fb ok'; fb.innerHTML = cfg.back ? `Richtig! Die Kugel ${ch} kommt danach <b>zurück</b> in die Socke.` : `Richtig! Die Kugel ${ch} bleibt <b>draußen</b>. Jetzt ist eine Kugel weniger drin.`;
          if (!cfg.back) bag.splice(bag.indexOf(ch), 1);
          step++; paint();
        }
        if (e.target.closest('.go2')) {
          let p = 1, b = cfg.balls.split('');
          for (const ch of cfg.word) { p *= b.filter(x => x === ch).length / b.length; if (!cfg.back) b.splice(b.indexOf(ch), 1); }
          const inp = $('.step.cur input', body); const r = judgeNum({ ans: p, kind: 'prob' }, inp.value);
          inp.classList.toggle('ok', r.ok); inp.classList.toggle('bad', !r.ok);
          fb.className = 'fb ' + (r.ok ? 'ok' : 'bad'); fb.innerHTML = r.ok ? `Super! P(${cfg.word}) ${cfg.back ? 'mit' : 'ohne'} Zurücklegen = ${pct(p)}.` : 'Multipliziere die drei Brüche: Zähler mal Zähler, Nenner mal Nenner. ' + (r.msg.startsWith('Knapp') ? r.msg : '');
          if (r.ok) done(true);
        }
      });
      body.addEventListener('enter', e => { e.stopPropagation(); const b = $('.go', body) || $('.go2', body); if (b) b.click(); });
      reset();
    }
  };
}

/* Kugelsack-Baukasten: schwarz/weiß ohne Zurücklegen */

        if (ok1 && ok2) { fb.className = 'fb ok'; fb.innerHTML = `Geschafft: ${s} schwarze und ${w} weiße Kugeln.`; done(true); }

      paint();
    }
  };
}

// fehlende Seiten aus der Aufgabe berechnen
function triSides(t) {

}

  const col = '#e2574c', ink = '#2b2533';
  const giv = { a: t.kind === 'sss' || t.kind === 'sws', b: t.kind === 'sss', c: true, alpha: t.kind === 'wsw', beta: t.kind === 'sws' || t.kind === 'wsw' };

  const txt = (pos, t, on) => { const anchor = pos[2] > .35 ? 'start' : (pos[2] < -.35 ? 'end' : 'middle'); return `<text x="${pos[0]}" y="${pos[1] + 5}" font-size="13" font-weight="800" text-anchor="${anchor}" fill="${on ? col : ink}" font-family="ui-rounded,system-ui">${t}</text>`; };
  const side = (P1, P2, on) => `<line x1="${P1[0]}" y1="${P1[1]}" x2="${P2[0]}" y2="${P2[1]}" stroke="${on ? col : ink}" stroke-width="${on ? 4 : 2}" stroke-linecap="round"/>`;
  const mid = (P1, P2) => [(P1[0] + P2[0]) / 2, (P1[1] + P2[1]) / 2];
  const arcAt = (V, Q, R, on) => { if (!on) return ''; const a1 = Math.atan2(Q[1] - V[1], Q[0] - V[0]), a2 = Math.atan2(R[1] - V[1], R[0] - V[0]); const r = 18; const sw = ((a2 - a1) + 4 * Math.PI) % (2 * Math.PI) < Math.PI ? 1 : 0; return `<path d="M${V[0] + r * Math.cos(a1)} ${V[1] + r * Math.sin(a1)} A${r} ${r} 0 0 ${sw} ${V[0] + r * Math.cos(a2)} ${V[1] + r * Math.sin(a2)}" fill="none" stroke="${col}" stroke-width="3"/>`; };
  const v = (k, val, u) => giv[k] ? ` = ${dez(val, 1)}${u}` : '';
  return `<svg viewBox="-14 0 228 160" width="100%">
    ${side(A, B, giv.c)}${side(B, C, giv.a)}${side(A, C, giv.b)}
    ${arcAt(A, B, C, giv.alpha)}${arcAt(B, C, A, giv.beta)}
    ${txt(out(A, 12), 'A')}${txt(out(B, 12), 'B')}${txt(out(C, 12), 'C')}
    ${txt(out(mid(A, B), 12), 'c' + v('c', t.c, ' cm'), giv.c)}
    ${txt(out(mid(B, C), 10), 'a' + v('a', t.a, ' cm'), giv.a)}
    ${txt(out(mid(A, C), 10), 'b' + v('b', t.b || 0, ' cm'), giv.b)}
    ${giv.alpha ? `<text x="${A[0] + 24}" y="${A[1] - 6}" font-size="12" font-weight="800" fill="${col}" font-family="ui-rounded,system-ui">α = ${t.alpha}°</text>` : ''}${giv.beta ? `<text x="${B[0] - 24}" y="${B[1] - 6}" font-size="12" font-weight="800" text-anchor="end" fill="${col}" font-family="ui-rounded,system-ui">β = ${t.beta}°</text>` : ''}
  </svg>`;
}

        const key = k.nr + t; const row = el(`<div class="pts"><div><b>${t})</b> ${txt}</div><div class="stepper"><button aria-label="weniger">−</button><span class="v"></span><button aria-label="mehr">+</button></div></div>`);
        const v = $('.v', row); const paint = () => v.textContent = `${S.ka[key] || 0} / ${mx}`;
        const [mi, pl] = $$('button', row); mi.onclick = () => { S.ka[key] = Math.max(0, (S.ka[key] || 0) - 1); save(); paint(); upd(); }; pl.onclick = () => { S.ka[key] = Math.min(mx, (S.ka[key] || 0) + 1); save(); paint(); upd(); };
        paint(); $('.ehs', c).appendChild(row);
      });
      if (k.tree) { const tb = $('.treebox', c); tb.appendChild(el('<p class="small muted" style="margin-top:12px">Musterbaum:</p>')); treeView(k.tree, tb); }
    });
    upd();
    return w;
  }
  function tab(t) { clearInterval(timer); body.innerHTML = ''; body.appendChild(t === 3 ? auswertung() : sheet(t)); $$('[data-tab]', main).forEach(b => b.classList.toggle('on', +b.dataset.tab === t)); }
  main.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) tab(+b.dataset.tab); });
  tab(1);
};

/* ===== Spickzettel ===== */
PAGES.spick = (main) => {
  main.style.setProperty('--c', '#c98410'); main.style.setProperty('--c-l', '#fdf0d4');
  main.appendChild(el(`<div class="band"><div><div class="nr">Zum Wiederholen</div><h1>Spickzettel</h1><div class="prog">Alles Wichtige auf einer Seite</div></div><div style="font-size:3rem">📒</div></div>`));
  card(main, `<h3>Häufigkeiten</h3><p>relative Häufigkeit = absolute Häufigkeit : Anzahl aller Versuche.<br>Gesetz der großen Zahlen: Bei vielen Versuchen liegen die relativen Häufigkeiten meist nah an den Wahrscheinlichkeiten. Bei wenigen Versuchen schwankt es stark.<br>Alle Wahrscheinlichkeiten zusammen = 1 = 100 %.</p>`, 'merk');
  card(main, `<h3>Laplace</h3><p>Alle Ergebnisse gleich wahrscheinlich. <span class="formula">P(E) = günstige : mögliche</span><br>Summenregel: Wahrscheinlichkeiten der passenden Ergebnisse addieren.<br>Gegenereignis: P(Ā) = 1 − P(A).<br>Erwartete Anzahl: n · P.</p>`, 'merk');
  card(main, `<h3>Baumdiagramm</h3><p><b>Entlang</b> eines Pfades multiplizieren (Pfadregel). Mehrere passende Pfade <b>addieren</b> (Summenregel). An jeder Verzweigung ergeben die Äste 1.</p><div class="t1"></div>`, 'merk');
  treeView({ depth: 2, levelNames: ['1. Los', '2. Los'], branches: loseTree }, $('.t1', main.lastChild));
  card(main, `<h3>Mit oder ohne Zurücklegen</h3><p>Mit: Brüche bleiben gleich. Ohne: Nenner wird bei jedem Zug um 1 kleiner, Zähler hängt vom Gezogenen ab.<br>Beispiel ohne Zurücklegen, Socke A A H H H, Wort AHA: ${fr(2, 5)} · ${fr(3, 4)} · ${fr(1, 3)} = ${fr(1, 10)}.</p>`, 'merk');
  card(main, `<h3>Genau, mindestens, keiner (n Versuche, Treffer p, daneben q = 1 − p)</h3><p>keinmal: q<sup>n</sup><br>mindestens einmal: 1 − q<sup>n</sup><br>genau einmal: n · p · q<sup>n−1</sup><br>alle: p<sup>n</sup></p>`, 'merk');
  card(main, `<h3>Dreiecke</h3><p>Planfigur → gegebene Größen farbig → Reihenfolge → konstruieren. Ecken A, B, C gegen den Uhrzeigersinn. a liegt A gegenüber.<br>Kongruenzsätze: sss, sws, wsw, Ssw (Winkel liegt der längeren Seite gegenüber).<br>Dreiecksungleichung: Zwei Seiten zusammen sind immer länger als die dritte.</p>`, 'merk');
};

boot();

</script>
